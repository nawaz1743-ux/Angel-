name: Angel Android APK Build

# Keep the newest build per ref; cancel superseded runs to avoid stale APKs.
concurrency:
  group: angel-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "angel/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tests-and-debug:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Run Android local unit tests
        working-directory: android-angel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build Angel debug APK
        working-directory: android-angel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Angel debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Android-APK
          path: android-angel/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  cloud-tests:
    name: Test Angel Ads Cloud API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ads-cloud
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ads-cloud/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run cloud API tests
        run: python -m pytest -q
